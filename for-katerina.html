<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Katerina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#fbfaf6;
    --ink:#3a3a34;
    --petal:#f6c445;
    --petal-deep:#f0a91f;
    --center:#5a3a22;
    --leaf:#4f7c3a;
    --leaf-deep:#3c6329;
    --stem:#4f7c3a;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html,body{
    height:100%;
    margin:0;
    background:var(--paper);
  }
  body{
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Patrick Hand', cursive;
    color:var(--ink);
    overflow:hidden;
    position:relative;
  }

  /* subtle paper texture */
  body::before{
    content:"";
    position:absolute;
    inset:0;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(0,0,0,0.015) 0, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(0,0,0,0.015) 0, transparent 40%);
    pointer-events:none;
  }

  .scene{
    position:relative;
    width:min(92vw, 460px);
    height:min(92vh, 720px);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-between;
    padding:6vh 0 5vh;
  }

  .title{
    font-family:'Caveat', cursive;
    font-weight:600;
    font-size:clamp(2.1rem, 7vw, 3rem);
    letter-spacing:0.5px;
    text-align:center;
  }

  .flower-wrap{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
  }

  .flower-wrap svg{
    width:100%;
    height:100%;
    max-height:56vh;
    overflow:visible;
  }

  .caption{
    font-family:'Caveat', cursive;
    font-weight:600;
    font-size:clamp(1.15rem, 4.4vw, 1.55rem);
    color:#8a8a80;
    text-align:center;
    max-width:80%;
    line-height:1.5;
  }

  /* ---- handwritten letter-by-letter animation ---- */
  .hw-letter{
    display:inline-block;
    opacity:0;
    white-space:pre;
    transform:translateY(var(--jy,4px)) rotate(var(--jr,0deg)) scale(0.94);
    animation:hwAppear 0.4s cubic-bezier(.3,.6,.3,1) forwards var(--d,0s);
  }
  @keyframes hwAppear{
    60%{ opacity:1; transform:translateY(calc(var(--jy,4px) * -0.4)) rotate(var(--jr,0deg)) scale(1.05); }
    to{ opacity:1; transform:translateY(0) rotate(var(--jr,0deg)) scale(1); }
  }

  /* ---- stem draw-on ---- */
  .stem-path{
    fill:none;
    stroke:var(--stem);
    stroke-width:5;
    stroke-linecap:round;
    stroke-dasharray:400;
    stroke-dashoffset:400;
    animation:draw 1.4s ease-out 0.3s forwards;
  }
  .stem-path.small{
    stroke-dasharray:260;
    stroke-dashoffset:260;
    animation:drawSmall 1.2s ease-out 0.7s forwards;
  }
  @keyframes draw{ to{ stroke-dashoffset:0; } }
  @keyframes drawSmall{ to{ stroke-dashoffset:0; } }

  /* ---- leaves ---- */
  .leaf{
    transform-origin:var(--lox,0px) var(--loy,0px);
    transform:scale(0);
    opacity:0;
    animation:leafPop 0.6s cubic-bezier(.34,1.56,.64,1) forwards;
    fill:var(--leaf);
  }
  .leaf.deep{ fill:var(--leaf-deep); }
  @keyframes leafPop{
    to{ transform:scale(1); opacity:1; }
  }

  /* ---- flower heads ---- */
  .flower{
    transform-origin:center;
    transform:scale(0) rotate(-8deg);
    opacity:0;
    animation:bloom 0.85s cubic-bezier(.34,1.56,.64,1) forwards;
  }
  @keyframes bloom{
    to{ transform:scale(1) rotate(0deg); opacity:1; }
  }

  .petal{
    fill:var(--petal);
  }
  .petal:nth-child(odd){
    fill:var(--petal-deep);
  }

  @media (prefers-reduced-motion: reduce){
    .title, .caption, .stem-path, .leaf, .flower{
      animation:none !important;
      opacity:1 !important;
      transform:none !important;
      stroke-dashoffset:0 !important;
    }
  }
</style>
</head>
<body>

<div class="scene">
  <div class="title" data-hw="0.2" data-text="For Katerina &lt;3"></div>

  <div class="flower-wrap">
    <svg viewBox="0 0 400 520" xmlns="http://www.w3.org/2000/svg">

      <!-- big stem -->
      <path class="stem-path" d="M 235 500 C 230 420, 245 340, 228 250" />
      <!-- small stem -->
      <path class="stem-path small" d="M 235 500 C 210 460, 175 420, 155 340" />

      <!-- leaves on big stem -->
      <path class="leaf" style="--lox:250px; --loy:400px; animation-delay:1.5s"
        d="M 250 400 C 300 385, 330 350, 320 310 C 280 320, 245 355, 250 400 Z" />
      <path class="leaf deep" style="--lox:222px; --loy:340px; animation-delay:1.7s"
        d="M 222 340 C 170 330, 140 295, 150 255 C 195 265, 228 300, 222 340 Z" />

      <!-- leaves on small stem -->
      <path class="leaf" style="--lox:190px; --loy:430px; animation-delay:1.9s"
        d="M 190 430 C 145 420, 118 390, 128 355 C 168 365, 196 393, 190 430 Z" />

      <!-- small flower (front, lower) -->
      <g class="flower" style="animation-delay:2.1s">
        <g transform="translate(150,335)">
          <g>
            <!-- petals ring -->
            <g stroke="none">
              <ellipse class="petal" cx="0" cy="-42" rx="15" ry="26"/>
              <ellipse class="petal" cx="29" cy="-29" rx="15" ry="26" transform="rotate(45 29 -29)"/>
              <ellipse class="petal" cx="42" cy="0" rx="15" ry="26" transform="rotate(90 42 0)"/>
              <ellipse class="petal" cx="29" cy="29" rx="15" ry="26" transform="rotate(135 29 29)"/>
              <ellipse class="petal" cx="0" cy="42" rx="15" ry="26" transform="rotate(180 0 42)"/>
              <ellipse class="petal" cx="-29" cy="29" rx="15" ry="26" transform="rotate(225 -29 29)"/>
              <ellipse class="petal" cx="-42" cy="0" rx="15" ry="26" transform="rotate(270 -42 0)"/>
              <ellipse class="petal" cx="-29" cy="-29" rx="15" ry="26" transform="rotate(315 -29 -29)"/>
            </g>
            <circle r="21" fill="var(--center)"/>
            <circle r="21" fill="none" stroke="#4a2c18" stroke-width="1" opacity="0.4"/>
          </g>
        </g>
      </g>

      <!-- big flower (back, upper) -->
      <g class="flower" style="animation-delay:2.5s">
        <g transform="translate(258,190) scale(1.25)">
          <g stroke="none">
            <ellipse class="petal" cx="0" cy="-42" rx="15" ry="26"/>
            <ellipse class="petal" cx="29" cy="-29" rx="15" ry="26" transform="rotate(45 29 -29)"/>
            <ellipse class="petal" cx="42" cy="0" rx="15" ry="26" transform="rotate(90 42 0)"/>
            <ellipse class="petal" cx="29" cy="29" rx="15" ry="26" transform="rotate(135 29 29)"/>
            <ellipse class="petal" cx="0" cy="42" rx="15" ry="26" transform="rotate(180 0 42)"/>
            <ellipse class="petal" cx="-29" cy="29" rx="15" ry="26" transform="rotate(225 -29 29)"/>
            <ellipse class="petal" cx="-42" cy="0" rx="15" ry="26" transform="rotate(270 -42 0)"/>
            <ellipse class="petal" cx="-29" cy="-29" rx="15" ry="26" transform="rotate(315 -29 -29)"/>
          </g>
          <circle r="21" fill="var(--center)"/>
          <circle r="21" fill="none" stroke="#4a2c18" stroke-width="1" opacity="0.4"/>
        </g>
      </g>

    </svg>
  </div>

  <div class="caption" data-hw="3.6" data-text="Meeting you was like listening to a song for the first time and knowing it will be my favorite"></div>
</div>

<script>
(function(){
  function seededRandom(seed){
    // simple deterministic pseudo-random so it looks the same each load
    var s = seed;
    return function(){
      s = (s * 9301 + 49297) % 233280;
      return s / 233280;
    };
  }

  function animateHandwriting(el){
    var text = el.getAttribute('data-text') || el.textContent;
    var baseDelay = parseFloat(el.getAttribute('data-hw') || '0');
    var rand = seededRandom(text.length * 97 + 13);
    var perLetter = 0.045; // seconds between letters, like a pen moving

    el.textContent = '';
    el.setAttribute('aria-label', text);

    var words = text.split(' ');
    var visibleIndex = 0;

    words.forEach(function(word, wi){
      var wordSpan = document.createElement('span');
      wordSpan.style.display = 'inline-block';
      wordSpan.style.whiteSpace = 'nowrap';

      for (var i = 0; i < word.length; i++){
        var span = document.createElement('span');
        span.className = 'hw-letter';
        span.textContent = word[i];
        var jr = (rand() * 10 - 5).toFixed(2) + 'deg';   // -5deg to 5deg
        var jy = (3 + rand() * 5).toFixed(1) + 'px';      // 3px to 8px rise
        span.style.setProperty('--jr', jr);
        span.style.setProperty('--jy', jy);
        span.style.setProperty('--d', (baseDelay + visibleIndex * perLetter) + 's');
        visibleIndex++;
        wordSpan.appendChild(span);
      }
      el.appendChild(wordSpan);

      if (wi < words.length - 1){
        el.appendChild(document.createTextNode(' '));
        visibleIndex++; // count the space toward pacing
      }
    });
  }

  document.querySelectorAll('[data-hw]').forEach(animateHandwriting);
})();
</script>

</body>
</html>
